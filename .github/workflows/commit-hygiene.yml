name: Commit hygiene

on: [push, pull_request]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 50, persist-credentials: false}
      - name: No AI attribution in commits
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || echo 0000000000000000000000000000000000000000)
          fi
          echo "refs/heads/x $(git rev-parse HEAD) refs/heads/x $base" | bash hooks/pre-push
