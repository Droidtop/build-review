name: Harness self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, path: harness}
      - uses: ./harness/.github/actions/setup
      - name: Unit tests (fixtures, with the real analysers installed)
        working-directory: harness
        run: python -m pytest -q tests
      - name: Workflow lint
        working-directory: harness
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
