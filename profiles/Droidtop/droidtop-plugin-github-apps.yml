# App releases (droidtop.github-apps). DRAFT by the harness lane (2026-11-05), read from
# plugin-unstable (droidtop.github-apps.droidplugin.tar.xz) and the repo at a5fa28e. Host-API permissions
# carry the manifest's own reasons. The plugins lane confirms it on Droidtop/tracker#550.
repo: Droidtop/droidtop-plugin-github-apps
extends: _kinds/droidtop-plugin
purpose: >
  Installs and updates Android apps from their release pages on GitHub, GitLab and Codeberg, like
  Obtainium. (manifest.template.json)
plugin_permissions:
  net.any: "Reads release pages and APK files on GitHub, GitLab, Codeberg and any Forgejo server you add (manifest.template.json)"
  intents.in: "Opens links to a project's releases page (github.com/owner/repo/releases) so you can review and track the app (manifest.template.json)"
  github.api: "Uses your GitHub sign-in for GitHub requests, which raises the hourly request limit; your token stays in droidtop (manifest.template.json)"
  files.picker: "Lets you pick an Obtainium export file to import (manifest.template.json)"
hosts:
  api.github.com: "Release lookups for the apps the person follows"
  github.com: "Release pages and downloads"
