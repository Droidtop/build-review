# droidtop's review profile. permissions, exported_ok and native_libs are
# the droidtop lane's, read from the merged manifest and lib/ of
# v0.2.0-dev.2898 and checked against droidtop main 60cc0ea24, each with
# its reason (https://github.com/Droidtop/tracker/issues/550#issuecomment-6647163484).
# api, api_callers_ok and explained follow that comment's explanations.
# hosts is still the harness lane's draft, from main's sources at
# 8b447d7; the droidtop lane has not confirmed it yet.
repo: Droidtop/droidtop
purpose: >
  An Android frontend for handhelds: a gaming shell, a standard launcher and
  a desktop mode over one library of games from many stores and sources. It
  installs and launches emulators and apps, hosts plugins (dex loaded in an
  isolated process), runs Linux containers without root, and streams games
  through windowcast.
artefacts:
  - {pattern: "droidtop-debug*.apk", kind: apk, debug: true}   # the in-app "Install debug builds" variant
  - {pattern: "droidtop*.apk", kind: apk}
  - {pattern: "*.droidplugin.tar.xz", kind: plugin-bundle}
build:
  setup: repo-android-setup     # .github/actions/android-setup (android-build.yml:91)
  submodules: recursive         # android-build.yml:72
  # No secrets: app/build.gradle.kts:98-145 signs with the debug key when
  # SIGNING_KEYSTORE_PATH is unset, so a rebuild needs no signing material.
  # Both published APKs, under their published names
  # (build-scripts/release_channel.py:102-103), so the two reviews compare.
  # Release and debug in two Gradle runs with two workers each, the daemon
  # stopped between them. droidtop's gradle.properties budgets ~13 of the
  # runner's 16 GB for a build that restores droidtop's own Gradle cache; a
  # rebuild here starts cold, and twice lost its runner in R8 with that one
  # command (pilot runs 42002552036 and 42070954537: 80 GB disk free, 15,982
  # MB memory). Neither the worker count nor the order changes what is built.
  command: >-
    ./gradlew --max-workers=2 :app:assembleRelease --stacktrace &&
    ./gradlew --stop &&
    ./gradlew --max-workers=2 :app:assembleDebug --stacktrace
  outputs:
    "app/build/outputs/apk/release/app-universal-release*.apk": droidtop.apk
    "app/build/outputs/apk/debug/app-universal-debug*.apk": droidtop-debug.apk

