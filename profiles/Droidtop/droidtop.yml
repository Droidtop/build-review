  - shizuku.rikka.app
  - play.google.com
  - storage.googleapis.com
  - gitlab.com
  - www.python.org
  - mamedev.org
  - specs.openid.net
  - code.google.com
native_libs: []            # the lane lists them; until then each is a medium finding
exported_ok: []
dynamic:
  monkey_events: 800
