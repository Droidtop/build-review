# The rpgmaker-mkxp-z core's review profile. DRAFT by the harness lane (2026-11-05), read from
# rpgmaker-rgss-v1-testing (dev.enginehost.rpgmaker.rgss.v1.enginehost.tar.xz) and the core at 8ffc018068. The Enginehost
# cores lane confirms it on Droidtop/tracker#550.
repo: Droidtop/enginehost-rpgmaker-mkxp-z-plugin
extends: _kinds/enginehost-core
purpose: >
  Runs RPG Maker XP/VX/VX Ace (RGSS) games with mkxp-z as an Enginehost core on the activity transport.
  bundle-metadata.json: engine rpgmaker, lockdown None, transport android-activity.
build:
  workflow: .github/workflows/android-plugin.yml   # the core's own build job (it uploads build/unsigned.tar)
  job: android
api:
